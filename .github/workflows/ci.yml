name: CI

on:
  push:
    branches:
      - prototype
      - main
      - master
  pull_request:
    branches:
      - prototype
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Verify Code Style (Spotless / ktlint)
        run: ./mvnw --batch-mode --no-transfer-progress spotless:check

      - name: Build, Test, and Verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify -Dgpg.skip=true

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: target/*.jar

